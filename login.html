<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Professor | Formação.TI</title>
  <meta name="description" content="Acesso à área do professor — ambiente docente da plataforma Formação.TI.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main style="padding-top: 160px;">
    <section class="container" style="max-width: 480px; margin-bottom: 4rem;">
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2.5rem;">
        <span class="eyebrow" style="display: block; margin-bottom: 0.75rem;">Área do professor</span>
        <h1 class="font-serif" style="font-size: 2rem; margin-bottom: 0.75rem;">Acesso ao ambiente docente</h1>
        <p style="color: var(--text-muted); font-size: 0.9375rem; line-height: 1.6; margin-bottom: 2rem;">
          Espaço reservado ao corpo docente para acompanhamento das turmas e dos percursos formativos.
        </p>

        <form id="login-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div style="display: flex; flex-direction: column; gap: 0.375rem;">
            <label for="login-email" style="font-size: 0.875rem; font-weight: 600;">E-mail institucional</label>
            <input id="login-email" name="email" type="email" required autocomplete="email"
              placeholder="professor@escola.edu.br"
              style="padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 4px; background: white; font-family: var(--font-sans); font-size: 0.9375rem; color: var(--text);">
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.375rem;">
            <label for="login-senha" style="font-size: 0.875rem; font-weight: 600;">Senha</label>
            <input id="login-senha" name="senha" type="password" required autocomplete="current-password"
              style="padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 4px; background: white; font-family: var(--font-sans); font-size: 0.9375rem; color: var(--text);">
          </div>
          <button type="submit" class="btn btn-primary">Entrar</button>
          <p id="login-feedback" role="status" aria-live="polite" style="font-size: 0.875rem; color: var(--text-muted); margin: 0;"></p>
        </form>
      </div>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
